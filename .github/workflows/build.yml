name: build

on:
  push:
    # Tags are built by release.yml, which calls this workflow; do not build them twice.
    branches: ['**']
  pull_request:
  workflow_call:
    inputs:
      version:
        description: 'Installer version, for example 1.2.3. Empty: use the app csproj version plus the run number.'
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  # Builds the ONNX models from pinned sources (see tools/models/prepare_models.sh) and caches them,
  # so the model-backed integration tests run in CI. The cache key changes only when tools/models/ changes.
  models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore models cache
        id: cache
        uses: actions/cache@v4
        with:
          path: models-out
          key: models-${{ hashFiles('tools/models/**') }}
      - name: Build models (cache miss)
        if: steps.cache.outputs.cache-hit != 'true'
        run: bash tools/models/prepare_models.sh "$RUNNER_TEMP/models-work" "$GITHUB_WORKSPACE/models-out"
      - name: Verify model checksums
        run: cd models-out && sha256sum -c ../tools/models/models.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: models
          path: models-out
          if-no-files-found: error
          retention-days: 7

  core-linux:
    needs: models
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: models
          path: models
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install fonts and poppler (so the PDF text-layer tests really run)
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-core poppler-utils
      # Locked mode: restore fails if a package would differ from src/IndicOcr.Core/packages*.lock.json.
      - name: Restore (locked)
        run: |
          dotnet restore src/IndicOcr.Core --locked-mode
          dotnet restore tests/IndicOcr.Core.Tests --locked-mode
          dotnet restore src/IndicOcr.Cli --locked-mode
      - name: Build core library
        run: dotnet build src/IndicOcr.Core -c Release --no-restore
      - name: Test core library (all integration tests, with models)
        env:
          INDICOCR_MODELS: ${{ github.workspace }}/models
        run: dotnet test tests/IndicOcr.Core.Tests -c Release --no-restore
      - name: Build CLI
        run: dotnet build src/IndicOcr.Cli -c Release -warnaserror --no-restore

  windows:
    needs: models
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: models
          path: models
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      # Locked mode. The app has no lock file of its own; Core (restored with -r win-x64) uses packages.win-x64.lock.json.
      - name: Restore app (locked)
        run: dotnet restore app/IndicOcr.App/IndicOcr.App.csproj -r win-x64 -p:Platform=x64 --locked-mode
      - name: Build app (x64 Release)
        run: dotnet build app/IndicOcr.App/IndicOcr.App.csproj -c Release -r win-x64 -p:Platform=x64 --no-restore
      # After the app build: both restore Core, and the last restore decides the RID of Core's obj/project.assets.json.
      - name: Restore tests (locked)
        run: dotnet restore tests/IndicOcr.Core.Tests --locked-mode
      - name: Test core library (all integration tests, with models and bundled Noto fonts)
        env:
          INDICOCR_MODELS: ${{ github.workspace }}/models
          INDICOCR_TEST_FONTS: ${{ github.workspace }}/app/IndicOcr.App/fonts
        run: dotnet test tests/IndicOcr.Core.Tests -c Release --no-restore
      - name: Publish app (self-contained x64)
        run: dotnet publish app/IndicOcr.App/IndicOcr.App.csproj -c Release -r win-x64 -p:Platform=x64 --self-contained true -o publish/win-x64
      - name: Smoke test the published app
        shell: pwsh
        run: |
          $dir = Resolve-Path publish/win-x64
          $exe = Join-Path $dir 'IndicOcr.App.exe'
          if (-not (Test-Path $exe)) { throw "Missing $exe" }
          if (-not (Get-ChildItem $dir -Filter *.pri)) { throw "No .pri resource index in the publish folder (the app cannot load its XAML without it)" }
          if (-not (Test-Path (Join-Path $dir 'fonts/NotoSansTelugu-Regular.ttf'))) { throw "Bundled fonts are missing from the publish folder" }
          $p = Start-Process -FilePath $exe -WorkingDirectory $dir -PassThru
          Start-Sleep -Seconds 10
          if ($p.HasExited) {
            Write-Host "IndicOcr.App.exe exited early with code $($p.ExitCode)"
            exit 1
          }
          Write-Host "App is still running after 10 s"
          Stop-Process -Id $p.Id -Force
      - name: Report publish size (installer budget is 150 MB without models)
        shell: pwsh
        run: |
          $bytes = (Get-ChildItem publish/win-x64 -Recurse -File | Measure-Object -Property Length -Sum).Sum
          $mb = [math]::Round($bytes / 1MB, 1)
          Write-Host "Publish folder size: $mb MB (budget 150 MB, models excluded)"
          "### Publish size`n$mb MB of the 150 MB budget (models excluded)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          if ($mb -gt 150) { Write-Host "::warning::Publish folder exceeds the 150 MB installer budget" }
      - name: Publish CLI (self-contained x64, single folder; used only by the offline end-to-end check)
        run: |
          dotnet restore src/IndicOcr.Cli -r win-x64 --locked-mode
          dotnet publish src/IndicOcr.Cli -c Release -r win-x64 --self-contained true --no-restore -o publish/cli
      - name: Resolve installer version
        id: ver
        shell: pwsh
        run: |
          $v = '${{ inputs.version }}'.TrimStart('v')
          if (-not $v) {
            $csproj = [xml](Get-Content app/IndicOcr.App/IndicOcr.App.csproj)
            $base = ($csproj.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1)
            if (-not $base) { $base = '0.1.0' }
            $v = "$base-ci.${{ github.run_number }}"
          }
          if ($v -notmatch '^\d+\.\d+\.\d+([-.][0-9A-Za-z.]+)?$') { throw "Bad version: $v" }
          $nums = ($v -split '[-]')[0].Split('.')
          $numeric = (($nums + @('0','0','0','0'))[0..3]) -join '.'
          Write-Host "Installer version $v (numeric $numeric)"
          "version=$v" >> $env:GITHUB_OUTPUT
          "numeric=$numeric" >> $env:GITHUB_OUTPUT
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            Write-Host 'ISCC.exe not preinstalled; installing Inno Setup with Chocolatey (build machine only, not part of the app)'
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'choco install innosetup failed' }
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }
          $pub = (Resolve-Path publish/win-x64).Path
          $models = (Resolve-Path models).Path
          foreach ($f in 'det.onnx','rec_te.onnx','dict_te.txt') {
            if (-not (Test-Path (Join-Path $models $f))) { throw "Model file missing: $f" }
          }
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" "/DAppNumericVersion=${{ steps.ver.outputs.numeric }}" "/DPublishDir=$pub" "/DModelsDir=$models" installer/IndicOcr.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
      - name: Check installer size (budget 150 MB, models included)
        shell: pwsh
        run: |
          $setup = Get-ChildItem installer/out -Filter 'IndicOcr-Setup-*.exe' | Select-Object -First 1
          if (-not $setup) { throw 'No installer produced' }
          $mb = [math]::Round($setup.Length / 1MB, 1)
          Write-Host "Installer $($setup.Name): $mb MB (budget 150 MB; the 44 MB of models are inside)"
          "### Installer size`n$($setup.Name): **$mb MB** of the 150 MB budget (models included)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          if ($setup.Length -gt 150MB) { throw "Installer is $mb MB, over the 150 MB budget" }
      - uses: actions/upload-artifact@v4
        with:
          name: IndicOcr-installer
          path: installer/out/IndicOcr-Setup-*.exe
          if-no-files-found: error
      - name: Silent install, then offline end-to-end OCR check
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = (Get-ChildItem installer/out -Filter 'IndicOcr-Setup-*.exe' | Select-Object -First 1).FullName
          $inst = Join-Path $env:RUNNER_TEMP 'indic-install'
          $work = Join-Path $env:RUNNER_TEMP 'indic-e2e'
          New-Item -ItemType Directory -Force $work | Out-Null

          # 1. Silent per-user install into a temp dir.
          $p = Start-Process -FilePath $setup -Wait -PassThru -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/CURRENTUSER','/NORESTART',"/DIR=$inst","/LOG=$work\install.log")
          if ($p.ExitCode -ne 0) { Get-Content "$work\install.log" -ErrorAction SilentlyContinue | Select-Object -Last 40; throw "Installer exit code $($p.ExitCode)" }
          foreach ($f in 'IndicOcr.App.exe','models\det.onnx','models\rec_te.onnx','models\rec_en.onnx','models\dict_te.txt','fonts\NotoSansTelugu-Regular.ttf','licenses\THIRD_PARTY_NOTICES.md','licenses\OFL-fonts.txt','unins000.exe') {
            if (-not (Test-Path (Join-Path $inst $f))) { throw "Installed file missing: $f" }
          }
          $modelsDir = Join-Path $inst 'models'
          Write-Host "Installed models: $((Get-ChildItem $modelsDir).Count) files"

          # 2. Prove the firewall block works, using a copy of curl.exe as a control (a different path from the CLI).
          $curlCopy = Join-Path $work 'blocked-curl.exe'
          Copy-Item "$env:SystemRoot\System32\curl.exe" $curlCopy
          $control = & "$env:SystemRoot\System32\curl.exe" -sS -m 15 -o NUL -w '%{http_code}' https://example.com 2>&1
          Write-Host "Control, curl.exe without a rule: $control"
          New-NetFirewallRule -DisplayName 'IndicOcr CI block curl copy' -Direction Outbound -Action Block -Program $curlCopy | Out-Null
          $blocked = & $curlCopy -sS -m 15 -o NUL -w '%{http_code}' https://example.com 2>&1
          Write-Host "Curl copy with block rule: $blocked (exit $LASTEXITCODE)"
          if ($LASTEXITCODE -eq 0) { throw 'Firewall block rule had no effect on the control program; the offline proof would be meaningless' }

          # 3. Run the CLI against the INSTALLED models with all outbound traffic blocked for the CLI exe.
          $cli = (Resolve-Path publish/cli/indicocr.exe).Path
          New-NetFirewallRule -DisplayName 'IndicOcr CI block CLI' -Direction Outbound -Action Block -Program $cli | Out-Null
          try {
            Copy-Item installer/test/telugu-sample.png $work
            $out = Join-Path $work 'out'
            & $cli ocr (Join-Path $work 'telugu-sample.png') --models $modelsDir --lang te+en --format txt,docx,pdf --out-dir $out
            if ($LASTEXITCODE -ne 0) { throw "indicocr exit code $LASTEXITCODE" }
          } finally {
            Remove-NetFirewallRule -DisplayName 'IndicOcr CI block CLI' -ErrorAction SilentlyContinue
            Remove-NetFirewallRule -DisplayName 'IndicOcr CI block curl copy' -ErrorAction SilentlyContinue
          }
          foreach ($f in 'telugu-sample.txt','telugu-sample.docx','telugu-sample.ocr.pdf') {
            $fp = Join-Path $out $f
            if (-not (Test-Path $fp) -or (Get-Item $fp).Length -lt 1000) { throw "Output missing or too small: $f" }
          }
          $text = Get-Content (Join-Path $out 'telugu-sample.txt') -Raw -Encoding UTF8
          Write-Host $text
          $expected = Get-Content installer/test/expected-words.txt -Encoding UTF8 | Where-Object { $_.Trim() }
          $missing = @($expected | Where-Object { -not $text.Contains($_.Trim()) })
          if ($missing.Count -gt 0) { throw "OCR output is missing expected words: $($missing -join ', ')" }
          Write-Host "All $($expected.Count) expected Telugu words found, with the CLI blocked from the network."

          # 4. Silent uninstall. The Inno uninstaller re-launches itself, so wait until the folder is gone.
          Start-Process -FilePath (Join-Path $inst 'unins000.exe') -Wait -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART')
          $deadline = (Get-Date).AddSeconds(90)
          while ((Test-Path $inst) -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 2 }
          if (Test-Path $inst) { Get-ChildItem $inst -Recurse | Select-Object -First 20 FullName; throw "Install dir still exists after uninstall: $inst" }
          if (Test-Path (Join-Path $env:LOCALAPPDATA 'IndicOcr\cache')) { throw 'Uninstall left the cache folder behind' }
          Write-Host 'Uninstall removed the install dir and the cache.'
      - uses: actions/upload-artifact@v4
        with:
          name: IndicOcr-win-x64
          path: publish/win-x64
          if-no-files-found: error
