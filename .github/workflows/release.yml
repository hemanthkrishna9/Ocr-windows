name: release

# Push a tag such as v0.1.0 to build the installer and create a DRAFT GitHub Release for review.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      # The tag name without the leading v is the installer version.
      version: ${{ github.ref_name }}
    permissions:
      contents: read

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: IndicOcr-installer
          path: dist
      - name: Checksums
        working-directory: dist
        run: |
          ls -l
          sha256sum IndicOcr-Setup-*.exe | tee SHA256SUMS
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/IndicOcr-Setup-*.exe dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "Indic OCR ${GITHUB_REF_NAME#v}" \
            --notes "Unsigned build. Windows SmartScreen will warn on first run (More info, then Run anyway). Verify the download with SHA256SUMS. See docs/install.md and docs/offline-audit.md."
